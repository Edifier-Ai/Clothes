packages:
  - apps/*
  - packages/*
# pnpm 11 起配置写在 workspace 文件；hoisted 让 Metro/Jest/Gradle 按经典
# 扁平 node_modules 解析（RN 生态最稳路径）。
nodeLinker: hoisted
# 本机仅 win32-x64；不拉其他平台的 esbuild 等可选二进制，避免代理下抓取失败。
supportedArchitectures:
  os: [ win32, current ]
  cpu: [ x64, current ]
allowBuilds:
  better-sqlite3: true
  esbuild: true
  unrs-resolver: true
minimumReleaseAgeExclude:
  - expo-location@57.0.7
  - expo-sharing@57.0.13
